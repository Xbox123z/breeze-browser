name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build installer
        run: npm run pack:${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: breeze-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # 若配置了签名 secrets 则产出正式签名 APK，否则自动退化为 debug 签名
      - name: Decode keystore (if provided)
        if: env.BREEZE_KEYSTORE_BASE64 != ''
        env:
          BREEZE_KEYSTORE_BASE64: ${{ secrets.BREEZE_KEYSTORE_BASE64 }}
        run: |
          echo "$BREEZE_KEYSTORE_BASE64" | base64 -d > /tmp/breeze.keystore
          echo "BREEZE_KEYSTORE=/tmp/breeze.keystore" >> $GITHUB_ENV
      - name: Build release APK
        working-directory: android
        env:
          BREEZE_KEYSTORE: ${{ env.BREEZE_KEYSTORE }}
          BREEZE_KEYSTORE_PASSWORD: ${{ secrets.BREEZE_KEYSTORE_PASSWORD }}
          BREEZE_KEY_ALIAS: ${{ secrets.BREEZE_KEY_ALIAS }}
          BREEZE_KEY_PASSWORD: ${{ secrets.BREEZE_KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: breeze-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.apk" \) -exec cp {} dist/ \;
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true